# =====================================================================
# Koch-App — Beispiel-Compose für Produktion (Proxmox hinter Reverse Proxy)
# =====================================================================
# Kopieren nach deploy/compose.yaml und Werte anpassen (Image-Tag,
# ORIGIN, DB-Passwörter). Secrets besser aus einer
# .env-Datei lesen (siehe .env.example im selben Ordner).
#
# Drei Services:
#   1. mariadb  — Datenbank (persistentes Volume)
#   2. migrator — Flyway-Image aus GHCR (enthält db/migration/ der
#                 Image-Revision), migriert DB vor jedem App-Start und
#                 beendet sich danach (Einmal-Lauf)
#   3. app      — SvelteKit-Runtime, startet erst nach erfolgreichem
#                 Migrator-Lauf
#
# Migrationen sind im Migrator-IMAGE enthalten (kein Bind-Mount vom
# Host!) — dadurch sind App-Revision und Schema-Version immer synchron.
#
# Watchtower-Anmerkung: App und Migrator müssen mit demselben APP_TAG
# gezogen werden (Composed setzt beide über die Variable synchron).
# Ein Update läuft dann so: Image-Pull → migrator läuft einmal mit den
# neuen SQL-Files → App startet gegen das aktuelle Schema.
# =====================================================================

services:
  mariadb:
    image: mariadb:11
    container_name: koch-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-cooking}
      MARIADB_USER: ${DB_USER:-cooking}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - koch-db:/var/lib/mysql
    # Kein Port-Publishing — nur internes Netzwerk. Zugriff läuft
    # ausschließlich über die App, nie von außen.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrator:
    # Eigenes Migrator-Image aus GHCR (Dockerfile-Target "migrator"):
    # enthält die SQL-Files der Image-Revision. KEIN Bind-Mount vom Host
    # mehr — dieser konnte veralten, während Watchtower nur das Image
    # aktualisierte. OWNER/REPO wie beim app-Service ersetzen; APP_TAG
    # hält beide synchron.
    image: ghcr.io/OWNER/REPO-migrator:${APP_TAG:-edge}
    container_name: koch-migrator
    depends_on:
      mariadb:
        condition: service_healthy
    command: >
      -url=jdbc:mariadb://mariadb:3306/${DB_NAME:-cooking}
      -user=${DB_USER:-cooking}
      -password=${DB_PASSWORD}
      -connectRetries=60
      migrate
    restart: "no"

  app:
    # Platzhalter — OWNER/REPO durch deinen GitHub-Namen + Repo ersetzen.
    # Tag via APP_TAG-Variable (Default :edge); Watchtower sollte denselben
    # Tag für Migrator UND App ziehen, damit beide synchron sind.
    image: ghcr.io/OWNER/REPO:${APP_TAG:-edge}
    container_name: koch-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      # Nur Loopback — der Reverse Proxy (Nginx/Caddy) davor übernimmt
      # TLS und leitet weiter. Niemals direkt ans Internet!
      - "127.0.0.1:3000:3000"
    volumes:
      # /data enthält nur noch Bilder (DB ist in MariaDB).
      - koch-images:/data/images
    env_file:
      - .env
    environment:
      # ⚠️ ORIGIN MUSS in der .env stehen (z. B. ORIGIN=https://recipes.lkit.ch),
      # sonst lehnt SvelteKits CSRF-Schutz multipart-Uploads mit 403 ab
      # ("Cross-site POST form submissions are forbidden"). Der JSON-Codepfad
      # wird vom CSRF-Check nicht erfasst, weshalb nur Uploads scheitern —
      # ein verwirrendes Symptom. Ohne ORIGIN leitet adapter-node die Origin
      # aus X-Forwarded-* ab, was in der Proxy-Kette oft falsch herauskommt.
      # DB-Verbindung zum mariadb-Service (interner DNS-Name = Service-Name).
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-cooking}
      DB_USER: ${DB_USER:-cooking}
      DB_PASSWORD: ${DB_PASSWORD}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"

volumes:
  koch-db:
  koch-images:
