# Koch-App Login-Theme (Keycloak 26.x)
#
# Basiert auf dem neuen Keycloak-Default-Theme „keycloak.v2" (PatternFly 5),
# das seit Keycloak 26 Standard ist. Wir überschreiben NUR CSS — keine
# .ftl-Templates → möglichst sicher gegen Keycloak-Updates.
#
# Installation: den Ordner „koch" nach /opt/keycloak/themes/koch kopieren
# (oder in die Keycloak-Compose mounten, siehe README.md eine Ebene höher),
# Keycloak neu starten und dann in der Admin Console aktivieren:
#   Realm Settings → Themes → Login Theme = „koch"

parent=keycloak.v2
import=common/keycloak

# WICHTIG: `styles` ERSETZT die Liste des Parents (wird nicht angehängt).
# Deshalb zuerst das Parent-Stylesheet (wird über die Theme-Hierarchie
# aufgelöst), unser Override-CSS als letztes:
styles=css/styles.css css/koch.css
