# pnpm 11 verlangt explizite Genehmigung für native Build-Scripts.
# canvas liefert keine prebuilt Binaries für alle Plattformen und braucht
# daher node-gyp + System-Libs beim Build. better-sqlite3 ist weggefallen
# (MariaDB wird über den reinen JS mysql2-Treiber angebunden).
allowBuilds:
  canvas: true
onlyBuiltDependencies:
  - canvas
